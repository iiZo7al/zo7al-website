# Create a key in /dashboard > Connections > Minecraft player profiles.
# The bridge only sends profile data; it does not accept console commands.
endpoint: 'https://zo7al.is-a.dev/api/minecraft/bridge'
token: ''

# HTTPS requests run asynchronously. Online profiles refresh every 60 seconds.
sync-interval-seconds: 60
batch-size: 100
queue-limit: 5000

# Import players who played on this server before the plugin was installed.
# This reads a small number of offline profiles each second.
sync-offline-on-start: true
offline-players-per-second: 5
excluded-players: []

# LuckPerms primary groups -> the plain rank names shown on the website.
# No color codes, MiniMessage tags or chat prefixes are sent.
rank-names:
  default: DEFAULT
  owner: OWNER
  admin: ADMIN
  moderator: MODERATOR
  helper: HELPER
  vip: VIP
  mvp: MVP
  'mvp+': 'MVP+'
  'mvp++': 'MVP++'
  mvpplus: 'MVP+'
  mvpplusplus: 'MVP++'
  booster: BOOSTER
  youtube: YOUTUBE
  twitch: TWITCH
  tiktok: TIKTOK

# Optional numeric PlaceholderAPI overrides for your actual game/practice plugin.
# Blank values use native Minecraft counters when available. Wins/losses remain
# unknown until configured. Invalid configured placeholders remain unknown.
# Default streak is a persistent kill streak; best streak and placed blocks are
# tracked since installation. For your game's own streak, configure BOTH streak
# placeholders. Playtime must return seconds, distance meters, damage health points.
statistics:
  kills-placeholder: ''
  deaths-placeholder: ''
  wins-placeholder: ''
  losses-placeholder: ''
  streak-placeholder: ''
  best-streak-placeholder: ''
  playtime-seconds-placeholder: ''
  mob-kills-placeholder: ''
  blocks-broken-placeholder: ''
  blocks-placed-placeholder: ''
  jumps-placeholder: ''
  fish-caught-placeholder: ''
  animals-bred-placeholder: ''
  items-enchanted-placeholder: ''
  damage-dealt-placeholder: ''
  damage-taken-placeholder: ''
  distance-meters-placeholder: ''

