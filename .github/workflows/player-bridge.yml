name: Zo7al player bridge builds
on:
  pull_request:
    paths: ['plugins/**', '.github/workflows/player-bridge.yml']
  push:
    branches: [main]
    paths: ['plugins/**', '.github/workflows/player-bridge.yml']
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        plugin: [zo7al-player-bridge, zo7al-player-bridge-legacy]
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-java@v6.0.1
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
          cache-dependency-path: plugins/${{ matrix.plugin }}/pom.xml
      - name: Build and test plugin
        working-directory: plugins/${{ matrix.plugin }}
        run: mvn --batch-mode --no-transfer-progress verify
      - uses: actions/upload-artifact@v7.0.1
        with:
          name: ${{ matrix.plugin }}-1.1.0
          path: |
            plugins/${{ matrix.plugin }}/target/Zo7al-*.jar
            plugins/${{ matrix.plugin }}/src/main/resources/config.yml
            plugins/${{ matrix.plugin }}/README.md
          if-no-files-found: error
          retention-days: 30
